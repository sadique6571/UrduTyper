name: Android build check
on:
  push:
    branches: [feature/urdu-typer-2-foundation]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo "Android SDK not found"; exit 1; }
      - name: Create non-production Firebase build placeholder
        run: |
          if [ ! -e presentation/google-services.json ]; then
            printf '%s\n' '{"project_info":{"project_number":"123456789","project_id":"urdutyper-build-placeholder","storage_bucket":"urdutyper-build-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:0123456789abcdef","android_client_info":{"package_name":"me.nomi.urdutyper"}},"api_key":[{"current_key":"not-a-real-api-key"}],"oauth_client":[{"client_id":"123456789-abcdef0123456789.apps.googleusercontent.com","client_type":3}]}],"configuration_version":"1"}' > presentation/google-services.json
          fi
      - name: Build app
        run: |
          chmod +x ./gradlew
          ./gradlew :presentation:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UrduTyper-2-debug-apk
          path: presentation/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
