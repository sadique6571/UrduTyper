name: Android build check
on:
  push:
    branches: [feature/urdu-typer-2-foundation]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo "Android SDK not found"; exit 1; }
      - name: Verify production Firebase project configuration
        run: |
          python3 - <<'PY'
          import json
          p = 'presentation/google-services.json'
          c = json.load(open(p))
          assert c['project_info']['project_id'] == 'urdutyper2', 'Wrong Firebase project'
          assert any(x['client_info']['android_client_info']['package_name'] == 'me.nomi.urdutyper' for x in c['client']), 'Wrong Android package'
          print('Firebase project and package verified')
          PY
      - name: Verify stable signing keystore
        run: test -s presentation/urdutyper-debug.keystore
      - name: Register Firebase Android OAuth configuration for signed APK
        run: |
          python3 - <<'PY'
          import json
          path = 'presentation/google-services.json'
          data = json.load(open(path))
          client = next(x for x in data['client'] if x['client_info']['android_client_info']['package_name'] == 'me.nomi.urdutyper')
          android = {
            'client_id': '890990968637-0c5bjo4de0rhnomphesgmehjl3im3l5b.apps.googleusercontent.com',
            'client_type': 1,
            'android_info': {
              'package_name': 'me.nomi.urdutyper',
              'certificate_hash': '11b060639aaab3ae8da13a54075ba8c883eb77f4'
            }
          }
          client['oauth_client'] = [android] + [x for x in client.get('oauth_client', []) if x.get('client_type') != 1]
          with open(path, 'w') as stream:
            json.dump(data, stream, indent=2)
          print('Firebase OAuth client updated for stable signing SHA-1')
          PY
      - name: Verify lightweight Urdu font resource
        run: test -s presentation/src/main/res/font/noto_nastaliq_urdu.ttf
      - name: Verify actual APK signing certificate
        run: |
          ACTUAL=$(keytool -list -v -keystore presentation/urdutyper-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA1: //p' | head -1)
          EXPECTED='11:B0:60:63:9A:AA:B3:AE:8D:A1:3A:54:07:5B:A8:C8:83:EB:77:F4'
          echo "Signing SHA-1: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Signing key changed. Firebase OAuth fingerprint must match the APK."; exit 1; }
      - name: Build app
        run: |
          chmod +x ./gradlew
          ./gradlew :presentation:assembleDebug --stacktrace --no-daemon
      - name: Display APK signing fingerprints (diagnostic)
        continue-on-error: true
        run: |
          APK=$(find presentation/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -n "$APK" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -E 'SHA-1 digest|SHA-256 digest' || true
          else
            echo "APK or apksigner unavailable; continuing to artifact upload."
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UrduTyper-2-debug-apk
          path: presentation/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
