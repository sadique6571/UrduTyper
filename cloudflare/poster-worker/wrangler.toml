name = "urdu-typer-posters"
main = "src/index.js"
compatibility_date = "2024-10-01"

[vars]
FIREBASE_PROJECT_ID = "urdutyper2"
# Set after the R2 bucket is created with public access, e.g.
# PUBLIC_BASE_URL = "https://pub-xxxxxxxxxxxxxxxx.r2.dev"
PUBLIC_BASE_URL = "REPLACE_WITH_R2_PUBLIC_URL"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "urdu-typer-posters"
